<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f8f5ee"/><g font-family="sans-serif" fill="#202b35"><text x="30" y="40" font-size="26">One Thing: proposed first interaction</text><g transform="translate(24,65)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">1. Too much to start</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">Several unfinished tasks</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">What is one thing you want</text><text x="128" y="145" font-size="13" fill="#246150">to get started on?</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g><g transform="translate(418,65)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">2. Pick a task</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">My lab report.</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">How many minutes</text><text x="128" y="145" font-size="13" fill="#246150">do you have?</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g><g transform="translate(812,65)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">3. Fit the time</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">About ten.</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">What is the smallest</text><text x="128" y="145" font-size="13" fill="#246150">first step?</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g><g transform="translate(24,420)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">4. Confirm the plan</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">Write the first paragraph.</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">Ten minutes for a paragraph.</text><text x="128" y="145" font-size="13" fill="#246150">Does that sound right?</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g><g transform="translate(418,420)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">5. Make a correction</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">Actually, choose photos first.</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">Ten minutes to choose photos.</text><text x="128" y="145" font-size="13" fill="#246150">Does that sound right?</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g><g transform="translate(812,420)"><rect width="376" height="335" rx="12" fill="white" stroke="#87939a"/><text x="16" y="30" font-size="18" font-weight="bold">6. Begin</text><path d="M35 257H345 M70 257V300 M320 257V300" stroke="#202b35" fill="none" stroke-width="3"/><circle cx="80" cy="166" r="22" fill="none" stroke="#202b35" stroke-width="3"/><path d="M80 188V241 M80 204L130 242 M80 241L48 293 M80 241L111 293" fill="none" stroke="#202b35" stroke-width="3"/><rect x="251" y="205" width="70" height="51" rx="8" fill="#ddebe6" stroke="#202b35" stroke-width="2"/><circle cx="287" cy="228" r="10" fill="none" stroke="#202b35"/><text x="18" y="73" font-size="14">Yes. I can start there.</text><rect x="126" y="105" width="234" height="70" fill="none"/><text x="128" y="125" font-size="13" fill="#246150">Ready when you are.</text><text x="128" y="145" font-size="13" fill="#246150">[Stop speaking]</text><text x="17" y="320" font-size="12" fill="#626e75">Wait for the full answer before the next question.</text></g></g></svg>